# 数据库初始化 Job — 首次部署时创建表结构
# 仅在 MySQL 就绪后执行一次
apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
  namespace: swapcampus
  labels:
    app: db-init
spec:
  ttlSecondsAfterFinished: 86400  # 完成后保留 1 天便于查看日志
  template:
    metadata:
      labels:
        app: db-init
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z mysql.swapcampus.svc.cluster.local 3306; do
                echo "Waiting for MySQL..."
                sleep 3
              done
      containers:
        - name: init-db
          image: mysql:8.0
          command:
            - sh
            - -c
            - |
              mysql -h mysql.swapcampus.svc.cluster.local -u${MYSQL_USER} -p${MYSQL_PASSWORD} ${MYSQL_DATABASE} < /schema/schema.sql
              echo "Schema created."
              mysql -h mysql.swapcampus.svc.cluster.local -u${MYSQL_USER} -p${MYSQL_PASSWORD} ${MYSQL_DATABASE} < /schema/seed.sql
              echo "Seed data injected."
          env:
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: swapcampus-secret
                  key: SPRING_DATASOURCE_USERNAME
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: swapcampus-secret
                  key: SPRING_DATASOURCE_PASSWORD
            - name: MYSQL_DATABASE
              value: "swapcampus"
          volumeMounts:
            - name: schema
              mountPath: /schema
      volumes:
        - name: schema
          configMap:
            name: db-schema
