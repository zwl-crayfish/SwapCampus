apiVersion: v1
kind: ConfigMap
metadata:
  name: swapcampus-config
  namespace: swapcampus
data:
  # 数据库连接（集群内 DNS 名称）
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql.swapcampus.svc.cluster.local:3306/swapcampus?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai"
  SPRING_DATASOURCE_USERNAME: "root"
  SPRING_DATA_REDIS_HOST: "redis.swapcampus.svc.cluster.local"
  MINIO_ENDPOINT: "http://minio.swapcampus.svc.cluster.local:9000"
  MINIO_BUCKET_NAME: "swapcampus"
  TZ: "Asia/Shanghai"
