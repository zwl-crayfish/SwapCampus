# ============================================
# SwapCampus H2 本地开发配置
# 使用方式: ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2
# 或设置环境变量: SPRING_PROFILES_ACTIVE=h2
#
# 无需安装 Docker / MySQL / Redis / MinIO
# 数据存储在内存中，每次重启清空
# ============================================
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:swapcampus;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_UPPER=FALSE;MODE=MySQL;NON_KEYWORDS=USER
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  # H2 模式下自动执行 schema.sql 初始化表结构
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  # 禁用 Redis（使用内存缓存）
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# MinIO 不可用，使用本地文件存储
minio:
  endpoint: http://localhost:9000
  access-key: disabled
  secret-key: disabled
  bucket-name: swapcampus

# 日志
logging:
  level:
    com.swapcampus: debug
    org.springframework.security: info
    org.springframework.boot.autoconfigure: warn
