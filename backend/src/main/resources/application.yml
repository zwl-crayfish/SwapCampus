server:
  port: 8080

spring:
  application:
    name: swapcampus

  # 默认使用 MySQL（Docker/K8s/CI 通过环境变量覆盖连接信息）
  # 本地无 Docker 开发可激活 H2 配置: spring.profiles.active=h2
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/swapcampus?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  # 禁用自动 SQL 初始化（MySQL schema 由 docker-entrypoint-initdb.d 或 db-init Job 管理）
  sql:
    init:
      mode: never

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379
      timeout: 3000ms

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.swapcampus.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# MinIO 对象存储
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET_NAME:swapcampus}

# JWT 配置（生产环境请通过环境变量覆盖）
jwt:
  secret: ${JWT_SECRET:SwapCampus2026DevSecretKeyForLocalDevelopmentOnly}
  expiration: 86400000  # 24小时

# 应用配置
app:
  upload:
    max-image-count: 9
    image-max-size: 5242880  # 5MB
    # 本地文件存储路径（MinIO 不可用时回退）
    local-storage-path: ./uploads

# AI 智能助手配置（智谱 GLM-4-Flash）
ai:
  # API Key：从 https://open.bigmodel.cn 获取（免费注册即可获得）
  api-key: ${AI_API_KEY:}  # 请通过环境变量设置，勿硬编码到配置文件
  # API 地址（默认为智谱 GLM-4，兼容 OpenAI 格式）
  # 智谱: https://open.bigmodel.cn/api/paas/v4/chat/completions
  # DeepSeek: https://api.deepseek.com/v1/chat/completions
  api-url: ${AI_API_URL:https://open.bigmodel.cn/api/paas/v4/chat/completions}
  # 模型名称
  model: ${AI_MODEL:glm-4-flash}
  # 超时时间（秒）
  timeout: ${AI_TIMEOUT:10}

# 日志
logging:
  level:
    com.swapcampus: debug
    org.springframework.security: info
