server:
  port: 8080

spring:
  application:
    name: swapcampus

  # 使用 H2 文件数据库（数据持久化，重启不丢失）
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/swapcampus;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_UPPER=FALSE
    username: sa
    password: 

  # H2 Console (开发环境)
  h2:
    console:
      enabled: true
      path: /h2-console

  # SQL 初始化
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  # 禁用 Redis (使用内存缓存)
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.swapcampus.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      ddl-auto: update

# MinIO 对象存储 (禁用，使用本地存储)
minio:
  enabled: false
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET_NAME:swapcampus}

# JWT 配置
jwt:
  secret: ${JWT_SECRET:SwapCampus2026DevSecretKeyForLocalDevelopmentOnly}
  expiration: 86400000  # 24小时

# 应用配置
app:
  upload:
    max-image-count: 9
    image-max-size: 5242880  # 5MB
    # 使用本地存储路径
    local-storage-path: ./uploads

# 日志
logging:
  level:
    com.swapcampus: debug
    org.springframework.security: info
